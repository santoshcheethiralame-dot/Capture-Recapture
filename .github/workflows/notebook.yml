name: notebook-check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notebook integrity (frozen pre-registrations, runs, required sections)
        run: python tools/notebook.py check
      - name: Python compiles
        run: python -m py_compile tools/notebook.py pilot/*.py research/notes/scripts/*.py
